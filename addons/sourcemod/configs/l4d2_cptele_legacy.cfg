// ============================================================================
//  l4d2_cptele_legacy.cfg  -  l4d2_checkpoint_teleport 的「原版按地点检测」表
// ============================================================================
//  1.3.1 起这张表从插件代码（原来的 GetLegacySite() 硬编码表）搬到这里：
//  改地图 / 加地图都不用重编译，管理员改完执行 sm_cptele_reload 即可生效。
//
//  读取方式：l4d2_cptele_legacy 1（默认）时由插件读取本文件；
//  文件名可用 l4d2_cptele_legacy_file 改（相对 addons/sourcemod/configs/）。
//  文件不存在 = 正常情况，插件静默回落到「运行时自动侦测」，不报错、不刷日志。
//
//  检测优先级（高 -> 低）：
//        1) l4d2_cptele_presets.cfg（预设地图，本文件同级目录）
//        2) 本文件（原版按地点检测）
//        3) 运行时自动侦测（安全屋 / 救援点 / 玩家按下的锁住按钮）
//  只有预设没有给出「中途集合点」时才会读本文件；本文件一旦命中本图，
//  动态按钮登记同样会被抑制（避免同一张图出现两个互相竞争的集合点）。
//
//  一个槽位（集合点）支持的键（与预设文件完全一致，同一个解析器）：
//        type        checkpoint（本表基本都是这个，可省略）
//        origin      "x y z"  区域中心；给了 origin 就按坐标 + 半径判定，
//                    此时不再找实体，倒计时结束也不会去「按下」任何按钮
//        radius      距离判定半径（HU）；默认取 l4d2_cptele_mech_radius（600）
//        classname   实体类名（默认 func_button）
//        targetname  实体 targetname
//        dest        "x y z"  倒计时结束时统一传送到这里（建议都写，比自动找点准）
//
//  ⚠ 选实体时的硬要求：优先挑「固定不动」的按钮
//    挂在父实体（parentname）下的按钮，m_vecOrigin 是相对父级的局部坐标。
//    插件 1.3.1 起会沿父级链还原世界坐标、并且跟着移动的电梯实时重算，
//    但仍然建议优先选不动的那个：例如 c4m2 的集合点该用顶层「呼叫电梯」的
//    button_callelevator，而不是车厢里的 button_inelevator（它在井底、按一次
//    还会 !self Kill 自删）。选父实体实体的另一个代价是：车一开走，判定中心
//    也跟着走，站在原地的生还者会「瞬间变成没到」。
//
//  1.3.2 起同样支持保留段（头是 '_' 或 '#' 的段不作为集合点登记），其中
//  "_ignore" { "rescue" "名字1,名字2" } 用来把「不该当救援区」的整个team触发体积
//  排除掉（救援区是按 trigger_multiple + m_iEntireTeam==2 整类自动登记的，cfg 里
//  删不掉，只能在注册阶段过滤）。一般写在预设表里就够了，两张表都会读。
//
//  怎么找 targetname：
//        bind p "getpos"（或 sm_printinfo / ent_text）对着按钮/机关看一眼；
//        也可以直接解 BSP 的 entities lump 搜 elevator / button。
// ============================================================================

"cptele_legacy"
{
	"_comment" "map => checkpoint areas (moved out of GetLegacySite in 1.3.1)"

	// ------------------------------------------------------------------
	// c1m1_hotel（No Mercy 1）：酒店电梯，按钮挂在 elevator_1 上（会跟着车厢走）
	// ------------------------------------------------------------------
	"c1m1_hotel"
	{
		"cp_elevator"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "elevator_button"
			"dest"       "2171 5810 2529"
		}
	}

	// ------------------------------------------------------------------
	// c1m4_atrium（No Mercy 4）：中庭电梯，按钮挂在 elevator 上
	// ------------------------------------------------------------------
	"c1m4_atrium"
	{
		"cp_elevator"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "button_elev_3rdfloor"
			"dest"       "-4039 -3402 598"
		}
	}

	// ------------------------------------------------------------------
	// c3m1_plankcountry（Swamp Fever 1）：渡轮按钮，挂在 ferry_tram 上
	// ------------------------------------------------------------------
	"c3m1_plankcountry"
	{
		"cp_ferry"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "ferry_tram_button"
			"dest"       "-5246 6060 50"
		}
	}

	// ------------------------------------------------------------------
	// c4m2_sugarmill_a（Hard Rain 2）：甘蔗田尽头的货运电梯
	//
	// 1.3.1 修正：原来指向车厢里的 button_inelevator（parentname elevator，
	// 开局停在井底 z≈154，而且 OnPressed 里有 "!self Kill" 自删），生还者
	// 到达的却是顶层（z≈660），那个按钮在井底、又挂在父实体上 → 区域中心
	// 算成局部坐标 → 到达人数恒为 0 → 倒计时永不触发（用户报的
	// 「c4m2 的电梯不触发传送倒计时，按按钮/人齐都不行」）。
	//
	// 顶层真正的集合点是 button_callelevator（无父级，按一下就把车厢叫上来：
	// OnPressed → elevator Movetofloor top），倒计时结束时插件 unlock+use 它
	// 就等于替玩家把电梯叫上来。车厢里那台按钮只负责「下行」，由地图自己的
	// trigger_elevator（entireteam=2）在全员进车厢后 Unlock，不需要插件插手。
	// ------------------------------------------------------------------
	"c4m2_sugarmill_a"
	{
		"cp_elevator"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "button_callelevator"
			"radius"     "700"
			"dest"       "-1475 -9558 660"
		}
	}

	// ------------------------------------------------------------------
	// c4m3_sugarmill_b（Hard Rain 3）：同一台升降机，但这一关生还者在井下，
	// 集合点就是车厢里的按钮（按下去 → relay_elevator_up → 车厢上行）。
	// 本图没有呼叫按钮，所以这里保留 button_inelevator（父实体感知由插件负责）。
	// ------------------------------------------------------------------
	"c4m3_sugarmill_b"
	{
		"cp_elevator"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "button_inelevator"
			"dest"       "-1479 -9558 175"
		}
	}

	// ------------------------------------------------------------------
	// c5m2_park（The Parish 2）：终局前的净化室触发体积（trigger_multiple，
	// 没挂父级，走 L4D_IsTouchingTrigger，是这张表里唯一不受父实体问题影响的条目）
	// ------------------------------------------------------------------
	"c5m2_park"
	{
		"cp_decon"
		{
			"type"       "checkpoint"
			"classname"  "trigger_multiple"
			"targetname" "finale_decon_trigger"
			"dest"       "-9667 -5970 -170"
		}
	}

	// ------------------------------------------------------------------
	// 医院楼顶电梯（L4D1 的 c8m4 / 对战版）
	// ------------------------------------------------------------------
	"c8m4_interior"
	{
		"cp_elevator"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "elevator_button"
			"dest"       "13427 15225 475"
		}
	}
	"l4d_hospital04_interior"
	{
		"cp_elevator"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "elevator_button"
			"dest"       "13427 15225 475"
		}
	}
	"l4d_vs_hospital04_interior"
	{
		"cp_elevator"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "elevator_button"
			"dest"       "13427 15225 475"
		}
	}

	// ------------------------------------------------------------------
	// 刻意不收录的两张图（1.2.4 / 需求 #6 的结论，保留在这里防止以后又被加回去）
	//
	// c6m3_port（The Passing 终局）：全部 changelevel 只有 1 个且 spawnflags=2、
	// map 指向自己（往回走到 c6m2 的回退触发），说明本图没有关底安全屋；过关走
	// trigger_finale。而 generator_elevator_button(origin -716 -552 342) 属于终局
	// 「罐油发电机 → 电梯」这套逃生流程的按钮，不是中途集合点。旧版把它当集合点：
	// 倒计时结束时既把掉队者传到发电机旁、又替玩家 unlock+use 按下它 —— 玩家表现为
	// 「做电梯下来到罐油发电机就直接结算分数并换边/进下一关」。
	//
	// c7m3_port（The Sacrifice 终局）：一个 changelevel 都没有；trigger_finale 是
	// type=2 / StartDisabled=1 / IsSacrificeFinale=1 的牺牲结局逃生装置。
	// bridge_start_button(origin -120 -1781 460) 是「启动吊桥/电梯」这个逃生动作的
	// 按钮，插件替玩家 unlock+use 它，等于主动启动逃生流程 => 直接结算换边。
	// ------------------------------------------------------------------
}