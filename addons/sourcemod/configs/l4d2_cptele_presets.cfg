// ============================================================================
//  l4d2_cptele_presets.cfg  -  l4d2_checkpoint_teleport 的「预设地图」检测表
// ============================================================================
//  作用：按地图名预置「地图中途集合点」，优先级最高。
//        命中本图的预设后，插件不再走「原版地点表」与「动态按钮登记」，
//        避免同一张图上冒出两个互相竞争的集合点。
//
//  读取方式：l4d2_cptele_preset 1 时由插件读取本文件。
//        改完不用重编译，地图开始时会重新读取；
//        本局内想立刻生效，管理员执行 sm_cptele_reload。
//        文件不存在 = 正常情况，插件静默回落到下一层检测，不报错。
//
//  检测优先级（高 -> 低）：
//        1) 本文件（预设地图）
//        2) 插件内置的「原版按地点检测」表（电梯图等 9 张）
//        3) 运行时自动侦测（安全屋 / 救援点 / 玩家按下的锁住按钮）
//
//  一个槽位（集合点）支持的键：
//        type        saferoom | rescue | checkpoint   （默认 checkpoint）
//        origin      "x y z"  区域中心；给了 origin 就按坐标 + 半径判定
//        radius      距离判定半径（HU）；默认取 l4d2_cptele_mech_radius
//        classname   实体类名，如 func_button / trigger_multiple
//        targetname  实体 targetname（可省略 = 取该类第一个实体）
//        dest        "x y z"  倒计时结束时统一传送到这里（可选）
//
//  两种写法二选一：给了 origin 就用坐标，否则用 classname + targetname。
//  trigger_* / info_changelevel 这类实体自动用「是否站在触发体积内」判定，
//  其余实体（func_button 等）用「到实体中心的距离 <= radius」判定。
//
//  怎么找 targetname：
//        bind p "getpos"（或 sm_printinfo / ent_text）对着按钮/机关看一眼，
//        地图实体一般都有可读的 targetname，比如 elevator_button、
//        ferry_tram_button、generator_elevator_button。
//
//  注意：本文件只影响「地图中途集合点」。关底安全屋与救援点始终由插件
//        自动侦测；如果你确实想手写这两个，把 type 写成 saferoom / rescue。
// ============================================================================

"cptele_presets"
{
	// 下面每个子段的名字（如 c1m1_hotel）就是生效的地图名。
	// 本文件默认所有示例都被注释掉 = 不改动现网行为；
	// 改成你的地图名、取消注释即可生效。
	"_comment" "map name => checkpoint areas; all examples below are commented out"

	// ------------------------------------------------------------------
	// 示例 1：实体写法（按钮类机关）—— 改成你地图的名字并去掉注释即可
	// ------------------------------------------------------------------
	// "c1m1_hotel"
	// {
	//     "cp_elevator"
	//     {
	//         "type"       "checkpoint"
	//         "classname"  "func_button"
	//         "targetname" "elevator_button"
	//         "radius"     "600"
	//         "dest"       "2171 5810 2529"
	//     }
	// }

	// ------------------------------------------------------------------
	// 示例 2：坐标写法（找不到合适的实体时，纯按位置判定）
	// ------------------------------------------------------------------
	// "c2m3_coaster"
	// {
	//     "cp_bridge"
	//     {
	//         "type"   "checkpoint"
	//         "origin" "-1024 2048 128"
	//         "radius" "450"
	//     }
	// }

	// ------------------------------------------------------------------
	// 示例 3：一张图多个集合点（比如先下电梯、再上渡船）
	// ------------------------------------------------------------------
	// "c3m1_plankcountry"
	// {
	//     "cp_ferry"
	//     {
	//         "type"       "checkpoint"
	//         "classname"  "func_button"
	//         "targetname" "ferry_tram_button"
	//         "radius"     "500"
	//         "dest"       "-5246 6060 50"
	//     }
	//     "cp_dock"
	//     {
	//         "type"   "checkpoint"
	//         "origin" "-5100 5900 40"
	//         "radius" "400"
	//     }
	// }

	// ------------------------------------------------------------------
	// 示例 4：手写安全屋 / 救援点（一般不需要，插件会自动侦测）
	// ------------------------------------------------------------------
	// "c5m2_park"
	// {
	//     "decon_room"
	//     {
	//         "type"       "rescue"
	//         "classname"  "trigger_multiple"
	//         "targetname" "finale_decon_trigger"
	//         "dest"       "-9667 -5970 -170"
	//     }
	// }
}
