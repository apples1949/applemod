// ============================================================================
//  l4d2_cptele_presets.cfg  -  l4d2_checkpoint_teleport 的「预设地图」检测表
// ============================================================================
//  作用：按地图名预置「地图中途集合点」，优先级最高。
//        命中本图的预设后，插件不再走「原版地点表」与「动态按钮登记」，
//        避免同一张图上冒出两个互相竞争的集合点。
//
//  读取方式：l4d2_cptele_preset 1 时由插件读取本文件。
//        改完不用重编译，地图开始时会重新读取；
//        本局内想立刻生效，管理员执行 sm_cptele_reload。
//        文件不存在 = 正常情况，插件静默回落到下一层检测，不报错。
//
//  检测优先级（高 -> 低）：
//        1) 本文件（预设地图）
//        2) l4d2_cptele_legacy.cfg「原版按地点检测」表（电梯图等 9 张；1.3.1 起
//           从插件代码搬到 cfg，改地图不用重编译）
//        3) 运行时自动侦测（安全屋 / 救援点 / 玩家按下的锁住按钮）
//
//  提示：本文件的槽位格式与 l4d2_cptele_legacy.cfg 完全一致（同一个解析器），
//        两张表的区别只有「优先级」和「有没有命中就抑制运行时登记」。
//
//  保留段（不当作集合点登记，1.3.2 起）：
//        以 '_' 或 '#' 开头的段名一律视为保留段，插件只读取、不登记：
//        "_ignore"   { "rescue" "名字1,名字2" }   救援区忽略名单
//                    终局图上 entireteam==2 的 trigger_multiple 不止逃生点一个时，
//                    把「不该当救援区」的那些目标名写进来（逗号 / 空格分隔）。
//                    被忽略的体积不会注册 AREA_RESCUE，也不会在逃离阶段起倒计时。
//        "_comment"  "说明文字"                   纯注释，随便写
//
//  一个槽位（集合点）支持的键：
//        type        saferoom | rescue | checkpoint   （默认 checkpoint）
//        origin      "x y z"  区域中心；给了 origin 就按坐标 + 半径判定
//        radius      距离判定半径（HU）；默认取 l4d2_cptele_mech_radius
//        classname   实体类名，如 func_button / trigger_multiple
//        targetname  实体 targetname（可省略 = 取该类第一个实体）
//        dest        "x y z"  倒计时结束时统一传送到这里（可选）
//
//  两种写法二选一：给了 origin 就用坐标，否则用 classname + targetname。
//  trigger_* / info_changelevel 这类实体自动用「是否站在触发体积内」判定，
//  其余实体（func_button 等）用「到实体中心的距离 <= radius」判定。
//
//  怎么找 targetname：
//        bind p "getpos"（或 sm_printinfo / ent_text）对着按钮/机关看一眼，
//        地图实体一般都有可读的 targetname，比如 elevator_button、
//        ferry_tram_button、generator_elevator_button。
//
//  注意：本文件只影响「地图中途集合点」。关底安全屋与救援点始终由插件
//        自动侦测；如果你确实想手写这两个，把 type 写成 saferoom / rescue。
// ============================================================================

"cptele_presets"
{
	// 下面每个子段的名字（如 c1m1_hotel）就是生效的地图名。
	// 本文件默认所有示例都被注释掉 = 不改动现网行为；
	// 改成你的地图名、取消注释即可生效。
	"_comment" "map name => checkpoint areas; all examples below are commented out"

	// ------------------------------------------------------------------
	// c4m2_sugarmill_a（Hard Rain 2）：甘蔗田尽头的货运电梯「顶层集合点」
	//
	// 为什么必须在这里写死，而不是靠原版地点表：
	//   原版地点表原来指向车厢里的 button_inelevator（parentname elevator，
	//   开局停在井底 z≈154），而生还者到达的是顶层 z≈660，两边差 490 HU、
	//   再加上父实体让 m_vecOrigin 变成局部坐标，区域中心直接塌到地图原点
	//   附近 —— 到达人数恒为 0，倒计时永不触发。
	//   顶层真正的按钮是 button_callelevator（无父级、按一下叫电梯上来），
	//   离这儿最近的按钮就是它。
	//
	// 预设优先级高于原版地点表，所以本段生效后，l4d2_cptele_legacy.cfg 里
	// 同图的条目会被忽略（那份是「预设被关掉时的兜底」，内容与这里一致）。
	// ------------------------------------------------------------------
	"c4m2_sugarmill_a"
	{
		"cp_elevator_top"
		{
			"type"       "checkpoint"
			"classname"  "func_button"
			"targetname" "button_callelevator"
			"radius"     "700"
			"dest"       "-1475 -9558 660"
		}
	}

	// ------------------------------------------------------------------
	// c6m3_port（The Passing 终局）：升罐电梯「顶层集合点」+ 救援区忽略名单
	//
	// 为什么这里只写坐标、不写实体：
	//   这一层唯一的机关按钮是 generator_elevator_button（parentname generator_elevator，
	//   spawnflags 3073 = 锁住）。地图自己的 generator_elevator_trigger（entireteam=2）
	//   会在全员站上升降台时 Unlock 它。插件如果绑这个按钮，倒计时结束就会替玩家
	//   unlock+use，把 12v12 里还没到的一半人留在下面 —— 这正是 1.2.4 把这张图的
	//   原版条目删掉的原因。坐标区域不会碰任何实体，只负责「把掉队者传上来」。
	//
	//   坐标取升降台顶层（generator_elevator top z=316，整个team触发器在 z=344）。
	//
	// _ignore 段解释：
	//   这张图有两个 entireteam==2 的 trigger_multiple：
	//     · trigger_escape            (8 -2832 48)   桥尾逃生判定，正是我们要的救援区
	//     · generator_elevator_trigger (-760 -580 344) 只是「全员在台上就解锁按钮」
	//   后者被当成救援区的话，逃离阶段一旦开始就可能抢先起 60 秒倒计时，把掉队者
	//   往起点侧传送。所以按目标名把它排除掉（名单大小写不敏感）。
	// ------------------------------------------------------------------
	"c6m3_port"
	{
		"cp_generator_lift"
		{
			"type"   "checkpoint"
			"origin" "-760 -580 340"
			"radius" "700"
			"dest"   "-760 -580 340"
		}

		"_ignore"
		{
			"rescue" "generator_elevator_trigger"
		}
	}

	// ------------------------------------------------------------------
	// 示例 1：实体写法（按钮类机关）—— 改成你地图的名字并去掉注释即可
	// ------------------------------------------------------------------
	// "c1m1_hotel"
	// {
	//     "cp_elevator"
	//     {
	//         "type"       "checkpoint"
	//         "classname"  "func_button"
	//         "targetname" "elevator_button"
	//         "radius"     "600"
	//         "dest"       "2171 5810 2529"
	//     }
	// }

	// ------------------------------------------------------------------
	// 示例 2：坐标写法（找不到合适的实体时，纯按位置判定）
	// ------------------------------------------------------------------
	// "c2m3_coaster"
	// {
	//     "cp_bridge"
	//     {
	//         "type"   "checkpoint"
	//         "origin" "-1024 2048 128"
	//         "radius" "450"
	//     }
	// }

	// ------------------------------------------------------------------
	// 示例 3：一张图多个集合点（比如先下电梯、再上渡船）
	// ------------------------------------------------------------------
	// "c3m1_plankcountry"
	// {
	//     "cp_ferry"
	//     {
	//         "type"       "checkpoint"
	//         "classname"  "func_button"
	//         "targetname" "ferry_tram_button"
	//         "radius"     "500"
	//         "dest"       "-5246 6060 50"
	//     }
	//     "cp_dock"
	//     {
	//         "type"   "checkpoint"
	//         "origin" "-5100 5900 40"
	//         "radius" "400"
	//     }
	// }

	// ------------------------------------------------------------------
	// 示例 4：手写安全屋 / 救援点（一般不需要，插件会自动侦测）
	// ------------------------------------------------------------------
	// "c5m2_park"
	// {
	//     "decon_room"
	//     {
	//         "type"       "rescue"
	//         "classname"  "trigger_multiple"
	//         "targetname" "finale_decon_trigger"
	//         "dest"       "-9667 -5970 -170"
	//     }
	// }
}
