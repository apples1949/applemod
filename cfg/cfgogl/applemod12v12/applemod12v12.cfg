// [tank_damage.smx] / [survivor_mvp_another.smx] 统计报告的输出裁剪
//   show_percent    只输出"有数据玩家"里排名靠前的多少百分比, 条数 = 上取整(数据条数 × 百分比 / 100)
//                   0 = 全部输出; 例: 18 条数据 50 -> 输出 9 条, 19 条数据 50 -> 输出 10 条
//   exclude_offline 1 = 输出时排除已不在服务器的玩家(中途退出的存档行), 0 = 不排除
// 注意先后顺序: 先用 exclude_offline 筛出"有数据玩家"的集合, 再对该集合取 show_percent%
//               (否则百分比的分母会把离线玩家算进去却又不输出, 条数对不上)
// 12v12 人比较多, 默认只显示前 50%; 中途退出的玩家数据默认仍然保留显示
confogl_addcvar l4d2_tankdamage_show_percent 50
confogl_addcvar l4d2_tankdamage_exclude_offline 0
confogl_addcvar l4d2_mvp_show_percent 50
confogl_addcvar l4d2_mvp_exclude_offline 0

// [tank_damage.smx] 坦克的输出统计(拳/石/铁 次数 + 总输出伤害 + 打中人数, 与存活时间合并成同一行输出)
//   print_tank_output        1 = 输出这段统计(默认)
//   print_tank_output_detail 1 = 带上拳/石/铁分类次数(默认), 0 = 只输出总伤害与打中人数(行太长时可关)
confogl_addcvar l4d2_tankdamage_print_tank_output 1
confogl_addcvar l4d2_tankdamage_print_tank_output_detail 1

// [L4DVSAutoSpectateOnAFK.smx] 旁观补位判定：死亡生还者占名额时不算真空位
//   1 = 生还者队里只要还有死亡生还者(真人/BOT/托管身体)占着名额，就不把生还者侧算作可补位，
//       此时只有特感侧确实有空位才会警告/踢出旁观 AFK 玩家（默认，避免"空位其实是死人"还赶人）
//   0 = 旧行为（只要 survivorHumans < survivor_limit 且有存活 AI Bot 就算可补位）
confogl_addcvar l4d_specafk_ignore_dead_survivor_slot 1

// [l4d_beblock.smx] 个人屏蔽(语音/文字)状态跨章节保存
//   1 = 屏蔽关系按 SteamID 记住，过关换图/断线重连后仍然屏蔽（默认，不用重新屏蔽）
//   0 = 旧行为（只按客户端索引记，换图即失效）
confogl_addcvar sm_beblock_persist 1

