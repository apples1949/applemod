// [witch_and_tankifier.smx]
confogl_addcvar sm_tank_can_spawn 1
confogl_addcvar sm_witch_can_spawn 1

// [witch_glow.smx] 女巫发光
confogl_addcvar l4d2_witch_glow_min_range 500
confogl_addcvar l4d2_witch_glow_max_range 2000

// [l4d2_antibaiter_safearea.smx] 团队不动刷尸潮的插件（安全区版：没有生还者离开安全区前不触发计时）
confogl_addcvar l4d2_antibaiter_delay 15
confogl_addcvar l4d2_antibaiter_horde_timer 30
confogl_addcvar l4d2_antibaiter_progress 0.03
confogl_addcvar l4d2_antibaiter_bile_stop 1

// [l4d_boss_percent.smx]
confogl_addcvar l4d_global_percent 0
confogl_addcvar l4d_tank_percent 1
confogl_addcvar l4d_witch_percent 1
confogl_addcvar l4d_boss_vote 1

// [l4d2_tongue_timer.smx]
confogl_addcvar l4d2_tongue_delay_tank 8.0
confogl_addcvar l4d2_tongue_delay_survivor 4.0

// [l4d2_nobhaps.smx]
confogl_addcvar simple_antibhop_enable 1
confogl_addcvar bhop_allow_survivor 0
confogl_addcvar bhop_except_si_flags 80	// 配合坦克技能 坦克和猴子可以连跳 后面再想办法限制（16+64）

// [boomer_horde_equalizer_12v12.smx]
confogl_addcvar boomer_horde_equalizer 1
confogl_addcvar boomer_horde_equalizer_events_default 1
confogl_addcvar z_notice_it_range 950
boomer_horde_amount 1 36
boomer_horde_amount 2 39
boomer_horde_amount 3 30
boomer_horde_amount 4 30
boomer_horde_amount 5 24
boomer_horde_amount 6 24
boomer_horde_amount 7 24
boomer_horde_amount 8 24
boomer_horde_amount 9 18
boomer_horde_amount 10 18
boomer_horde_amount 11 18
boomer_horde_amount 12 18

// [autopause.smx]
// 插件已停用 
//confogl_addcvar autopause_enable 0
//confogl_addcvar autopause_force 1
//confogl_addcvar autopause_apdebug 0

// [l4d_weapon_limits.smx] 本模式直接登记 12v12 值，每次配置执行时先解锁清理
l4d_wlimits_clear
l4d_wlimits_add 12 1 weapon_smg_silenced weapon_smg weapon_smg_mp5
l4d_wlimits_add 12 1 weapon_pumpshotgun weapon_shotgun_chrome
l4d_wlimits_add 1 1 weapon_sniper_awp
l4d_wlimits_add 1 1 weapon_sniper_scout
l4d_wlimits_add 1 1 weapon_chainsaw
l4d_wlimits_lock

// [l4d2_melee_shenanigans.smx]
confogl_addcvar l4d2_melee_drop_method 2

// [l4d2_playstats.smx + survivor_mvp]
//confogl_addcvar sm_survivor_mvp_brevity 0
//confogl_addcvar sm_survivor_mvp_brevity_latest 111
confogl_addcvar sm_stats_autoprint_vs_round 24756
// 日志/统计落盘开关: 全部关闭 —— 不写 addons/sourcemod/logs/ 下任何文件; 排障时按需临时改 1
confogl_addcvar sm_funfact_debug 0
confogl_addcvar sm_stats_debug 0
confogl_addcvar sm_stats_writestats 0

// [l4d2_skill_detect.smx]//添加其他提示
confogl_addcvar sm_skill_report_enable 1
confogl_addcvar sm_skill_report_crow 1
confogl_addcvar sm_skill_report_drawcrow 1
confogl_addcvar sm_skill_report_rockname 1
confogl_addcvar sm_skill_report_deadstop 1
confogl_addcvar sm_skill_report_pop 1
confogl_addcvar sm_skill_report_shove 1
confogl_addcvar sm_skill_report_caralarm 0 //关闭警报车触发提示

// Shared Settings
exec cfgogl/applemod12v12/shared_settings.cfg
