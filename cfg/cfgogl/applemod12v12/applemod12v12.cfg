// =======================================================================================
// Applemod 12v12 Cvars
//
// 顺序说明：
//   A 段 cvar 必须在本文件前部（confogl.cfg 已 exec 完 shared_cvars.cfg）
//   B 段先 exec 4v4 的 applemod.cfg —— 它末尾会 exec shared_settings.cfg，
//     那里面的 confogl_setcvars 一开始 tracking，之后任何 confogl_addcvar 都会被忽略
//   C 段是 server command / 运行时命令（不受 cvar tracking 影响），必须放在 B 段之后
// =======================================================================================

// ---------------------------------------------------------------- A. cvar（tracking 之前）
// ReadyUp 关闭：本模式改由 l4d2_doorlock 锁门开局
// （覆盖 shared_cvars.cfg:36 的 l4d_ready_enabled 3；readyup 关闭时 action.inc:15-20 直接 return，不会抢门锁）
l4d_ready_enabled 0

// [l4d2_doorlock.smx]
confogl_addcvar l4d2_dlock_allow 1
confogl_addcvar l4d2_dlock_modes_tog 4                // 4=对抗
confogl_addcvar l4d2_dlock_weakdoor 1                 // 开门后门掉落
confogl_addcvar l4d2_dlock_prepare1st 7               // 全员加载完后第一轮倒计时(秒)
confogl_addcvar l4d2_dlock_prepare2nd 7               // 第二轮倒计时(秒)
confogl_addcvar l4d2_dlock_timeout 90                 // 等待连接中玩家的超时(默认45；24人局调90)
confogl_addcvar l4d2_dlock_displaymode 1              // 倒计时显示：游戏提示
confogl_addcvar l4d2_dlock_displaypanel 2             // 状态面板：完整显示
confogl_addcvar l4d2_dlock_freezenodoor 1             // 没有门时冻结生还者

// [applemod12v12_weapon_drop.smx] 开局在随机生还者脚下生成指定武器
confogl_addcvar am12v12_wdrop_enable 1
confogl_addcvar am12v12_wdrop_weapons "weapon_chainsaw,weapon_rifle_sg552,weapon_sniper_awp,weapon_sniper_scout"
confogl_addcvar am12v12_wdrop_mode 0                  // 0=4 把堆在同一名随机生还者脚下；1=每把各挑一名随机生还者
confogl_addcvar am12v12_wdrop_delay 1.0               // 必须晚于框架 round_start+0.3s 的武器清理扫描
confogl_addcvar am12v12_wdrop_spread 20.0             // 4 把按四角散开，避免叠在一起
confogl_addcvar am12v12_wdrop_debug 0                 // 1=服务端控制台打印生成详情（排障用）

// [l4d_superversus.smx] 12v12 核心
confogl_addcvar l4d_survivor_limit 12
confogl_addcvar l4d_static_minimum_survivor 12        // 生还者队恒定 12 个身体（缺人补 AI bot）
confogl_addcvar l4d_infected_limit 12
confogl_addcvar l4d_versus_si_more 1                  // 特感人数不足时用 AI 特感补位
confogl_addcvar l4d_extra_first_aid 1                 // 医疗包只有出门发：开局按每多1人补1个（12人=4+8=12个）
confogl_addcvar l4d_finale_extra_first_aid 0          // 终局不补
confogl_addcvar l4d_versus_afk 0
confogl_addcvar l4d_respawn_on_join 1                 // 中途加入的额外生还者复活；竞技可改 0
confogl_addcvar director_auto_difficulty 0            // 关掉按人数自动缩放，用手工固定值
confogl_addcvar tank_health_versus 11000              // 与 confogl.cfg 的 z_tank_health 一致
confogl_addcvar si_jockey_health 350                  // 与 confogl.cfg 的 z_jockey_health 一致

// ---------------------------------------------------------------- B. 复用 4v4 插件 cvar
// 末尾 exec shared_settings.cfg → confogl_setcvars（tracking 开始，之后不许再 confogl_addcvar）
exec cfgogl/applemod/applemod.cfg

// ---------------------------------------------------------------- C. server command（tracking 之后也可以）
// 武器上限：applemod.cfg 刚用 4/4 锁定过 → 先 clear（会解锁）→ 重新按 12v12 值写入 → 再 lock
l4d_wlimits_clear
l4d_wlimits_add 12 1 weapon_smg_silenced weapon_smg weapon_smg_mp5   // 4v4=4 → ×3
l4d_wlimits_add 12 1 weapon_pumpshotgun weapon_shotgun_chrome        // 4v4=4 → ×3
l4d_wlimits_add 1 1 weapon_sniper_awp                                // AWP 限 1
l4d_wlimits_add 1 1 weapon_sniper_scout                              // 鸟狙 限 1（sniper_scout）
l4d_wlimits_add 1 1 weapon_chainsaw                                  // 电锯全图只允许 1 把在手上
l4d_wlimits_lock

// boomer 连炸表（与 12v12 版插件内置表一致；改这里即可覆盖内置值）
// 语义：boomer_horde_amount <本轮第 N 个被喷的生还者> <进尸潮队列的 common 数>
boomer_horde_amount 1 36
boomer_horde_amount 2 39
boomer_horde_amount 3 30
boomer_horde_amount 4 30
boomer_horde_amount 5 24
boomer_horde_amount 6 24
boomer_horde_amount 7 24
boomer_horde_amount 8 24
boomer_horde_amount 9 18
boomer_horde_amount 10 18
boomer_horde_amount 11 18
boomer_horde_amount 12 18
