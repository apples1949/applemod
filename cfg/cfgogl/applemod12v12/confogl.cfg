// AppleMod 12v12：独立入口。先登记本模式覆盖值，再读取本目录基础参数和插件设置。
// 同一 CVar 只登记一次；confogl_setcvars 仅在加载链末端执行。

// ReadyUp 名称（本模式真实开局由 l4d2_doorlock 负责，见 applemod12v12.cfg）
l4d_ready_cfg_name "applemod v0.97 12v12"

confogl_addcvar mp_gamemode "versus"  // Force Versus for the config.
confogl_addcvar z_difficulty "normal" // Force normal Difficulty

// 24 人局必须直连（L4D2 大厅上限 8 人）
confogl_addcvar sv_allow_lobby_connect_only 0

// ---------------------------------------------------------------------------------------
// ① 覆盖共享 cvar（必须写在 exec shared_cvars.cfg 之前）
// ---------------------------------------------------------------------------------------

// 枪柜里有电锯：必须放行，否则框架在 round_start+0.3s 扫全图武器时把它删掉
// 证据：confoglcompmod/WeaponInformation.sp:1206-1208(CreateTimer 0.3) → :1240-1254(全实体扫描) → :805(KillEntity)
// 枪柜是直接 CreateEntityByName("weapon_chainsaw")，跑不掉；这不是"物品解禁"，只放行枪柜那一把
confogl_addcvar confogl_remove_chainsaw 0

// 物品数据 ×3（4v4 值 2/2/2/0/1 → 6/6/6/0/3）；molotov 0×3 仍为 0（保持禁止）
confogl_addcvar confogl_adrenaline_limit 6
confogl_addcvar confogl_pipebomb_limit 6
confogl_addcvar confogl_vomitjar_limit 3
confogl_addcvar confogl_molotov_limit 0
confogl_addcvar confogl_pills_limit 6

// ---------------------------------------------------------------------------------------
// ② 12v12 独有数值
// ---------------------------------------------------------------------------------------

// 引擎与插件两层限额都登记；不能只依赖 CVar 值变化触发的单次同步。
confogl_addcvar survivor_limit 12
confogl_addcvar z_max_player_zombies 12
confogl_addcvar z_versus_smoker_limit 3
confogl_addcvar z_versus_boomer_limit 2   // 保持 2
confogl_addcvar z_versus_hunter_limit 3
confogl_addcvar z_versus_spitter_limit 2  // 保持 2（口水）
confogl_addcvar z_versus_jockey_limit 3
confogl_addcvar z_versus_charger_limit 3  // boomer/口水以外都是 3（合计 16 个类别位给 12 名特感）

// 尸潮 / 特感节奏（保守档；实测 server FPS 后再放量：common 84 / mob 48 / mega 136）
confogl_addcvar z_common_limit 60
confogl_addcvar z_mob_spawn_min_size 36
confogl_addcvar z_mob_spawn_max_size 36
confogl_addcvar z_mega_mob_size 100
confogl_addcvar z_mob_spawn_min_interval_normal 3600
confogl_addcvar z_mob_spawn_max_interval_normal 3600
confogl_addcvar z_ghost_delay_min 10
confogl_addcvar z_ghost_delay_max 10

// SI 伤害（按 12 个目标上调）
confogl_addcvar z_pounce_damage 2
confogl_addcvar z_pounce_damage_interval 0.3      // applemod 原值
confogl_addcvar hunter_pz_claw_dmg 8              // 4v4=5, 6v6=6
confogl_addcvar tongue_drag_damage_amount 5

// applemod 特色：高扑（保留）
confogl_addcvar z_hunter_max_pounce_bonus_damage 49
confogl_addcvar z_pounce_damage_range_min 300
confogl_addcvar z_pounce_damage_range_max 1729.1666

// 坦克按出生时生还者总人数（真人+AI）计算：4 人 6000，线性增加到 12 人 16500。
// z_tank_health 由本模式专属插件动态计算，不能再登记固定值，否则换图会覆盖人数结果。
confogl_addcvar appletankhp_base_health 6000
confogl_addcvar appletankhp_max 16500
confogl_addcvar appletankhp_enable 1
confogl_addcvar tank_hp 0 // 关闭 Apex 的独立血量覆盖，避免它在 tank_spawn 后重设满血
confogl_addcvar z_jockey_health 350

// ③ 共享 cvar（含所有物品限制的默认值，本模式不改其它条目）
exec cfgogl/applemod12v12/shared_cvars.cfg

// ④ 本模式插件设置；最终在本目录 shared_settings.cfg 内统一提交跟踪。
exec cfgogl/applemod12v12/applemod12v12.cfg
