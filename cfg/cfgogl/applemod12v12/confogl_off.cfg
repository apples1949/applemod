// Disable ReadyUp
l4d_ready_enabled 0

// Reset Default Common Limit, Static Spawns, and String Count
reset_static_maps
sm_resetstringcount

// Unlock Plugins and reload defaults
confogl_resetclientcvars
confogl_resetcvars
// 必须在 resetcvars 之后禁用，防止旧值回滚将动态血量重新打开。
sm_cvar appletankhp_enable 0
sm_cvar z_tank_health 4000
// 离开本模式时先同步插件名额，再恢复引擎 4v4；防止 12 人值泄漏到其他模式。
sm_cvar l4d_survivor_limit 4
sm_cvar l4d_infected_limit 4
sm_cvar l4d_static_minimum_survivor 4
sm_cvar survivor_limit 4
sm_cvar z_max_player_zombies 4
pred_unload_plugins
sm plugins load_unlock
sm plugins load l4d2_sv_tags.smx  //互联网显示服务器（confogl 比赛期间锁插件加载，所以先解锁再加载；不要在这里上锁，否则会把随后模式清单的加载全锁掉）
