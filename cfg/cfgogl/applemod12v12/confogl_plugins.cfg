// =======================================================================================
// Applemod 12v12 Plugins
// 专属插件统一放 addons/sourcemod/plugins/optional/12v12/
// =======================================================================================

//-------------------------------------------
// 共享插件（与 4v4 一致；末尾会 load confoglcompmod + match_vote）
//-------------------------------------------
exec cfgogl/applemod/shared_plugins.cfg

//-------------------------------------------
// 与 4v4 同款可选插件
//-------------------------------------------
//sm plugins load optional/survivor_mvp.smx
sm plugins load optional/another/survivor_mvp_another.smx
//sm plugins load optional/l4d2_antibaiter.smx//原版: applemod 模式改用下面的安全区版
sm plugins load optional/another/l4d2_antibaiter_safearea.smx//反baiter安全区版(v1.4.1)(apples1949)
sm plugins load optional/tranchi/l4d2_playstats_tranchi.smx
sm plugins load optional/l4d2_skill_detect.smx
sm plugins load optional/l4d2_tongue_timer.smx

//-------------------------------------------
// 12v12 专属
//-------------------------------------------
// 先把 4v4 那版 boomer 插件卸掉：否则两版都会 hook L4D_OnSpawnITMob（尸潮翻倍），
// 且 12v12 版启动时重新 patch 同一处 gamedata 会 SetFailState（SourceScramble 不能重复打补丁）
sm plugins unload optional/boomer_horde_equalizer_refactored.smx
sm plugins load optional/12v12/boomer_horde_equalizer_12v12.smx

// 抬 survivor_limit / z_max_player_zombies 上限（原版 4/4），并从 l4d_* 同步进引擎
sm plugins load optional/12v12/l4d_superversus.smx

// 替代 readyup 开局：安全门锁到全员加载完毕 + 倒计时开门
sm plugins load optional/12v12/l4d2_doorlock.smx

// 开局在随机生还者脚下生成 4 把枪（电锯 / SG552 / AWP / 鸟狙），替代枪柜
sm plugins load optional/12v12/applemod12v12_weapon_drop.smx

// 本模式不要开局选枪（givewpn）时打开下面这行（默认保留，但不作为武器来源）
//sm plugins unload optional/applemod/givewpn.smx
