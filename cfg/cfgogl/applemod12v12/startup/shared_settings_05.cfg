// STARTUP_BUFFER_CHUNKS: shared_settings 5/8; 后续配置位于同目录 startup/。
confogl_addcvar hc_unbreakable_forklifts 1

confogl_addcvar l4d2_disable_si_friendly_staggers 2

confogl_addcvar l4d2_block_infected_ff 1
confogl_addcvar l4d2_infected_ff_allow_tank 1

confogl_addcvar l4d2_undoff_enable 7
confogl_addcvar l4d2_undoff_blockzerodmg	7
confogl_addcvar l4d2_undoff_permdmgfrac		1.0

confogl_addcvar sm_unsilentjockey_interval 2.0

l4d2_addweaponrule rifle                  smg
l4d2_addweaponrule rifle_desert           smg_mp5
l4d2_addweaponrule rifle_ak47             smg_silenced
l4d2_addweaponrule rifle_sg552            smg
l4d2_addweaponrule autoshotgun            pumpshotgun
l4d2_addweaponrule shotgun_spas           shotgun_chrome
l4d2_addweaponrule sniper_military        hunting_rifle
l4d2_addweaponrule sniper_scout           hunting_rifle
l4d2_addweaponrule sniper_awp             hunting_rifle
l4d2_addweaponrule grenade_launcher       pistol
l4d2_addweaponrule rifle_m60              pistol_magnum

confogl_addcvar collision_tankrock_common 1
confogl_addcvar collision_smoker_common 0
confogl_addcvar collision_tankrock_incap 1

confogl_addcvar l4d2_shotgun_ff_enable 0
confogl_addcvar l4d2_shotgun_ff_multi 0.5
confogl_addcvar l4d2_shotgun_ff_min 1.0
confogl_addcvar l4d2_shotgun_ff_max 2.0

confogl_addcvar sm_lerp_enforce 0
confogl_addcvar sm_allowed_lerp_changes 99
confogl_addcvar sm_lerp_change_spec 99
confogl_addcvar sm_readyup_lerp_changes 1
confogl_addcvar sm_min_lerp 0.000
confogl_addcvar sm_max_lerp 0.100

confogl_addcvar starting_item_flags 25

confogl_addcvar sm_cfgmotd_title "Applemod"
confogl_addcvar sm_cfgmotd_url ""

confogl_addcvar l4d2_tank_bypass_extra_flow 1500

confogl_addcvar l4d_witch_damage_damage 100
confogl_addcvar l4d_witch_damage_incapped 40
confogl_addcvar l4d_witch_damage_direct_incap 1
confogl_addcvar z_witch_damage 100

confogl_addcvar tank_bohp_hp 3750

confogl_addcvar l4d2_fix_team_shuffle_final_map_disable 3
confogl_addcvar l4d2_fix_team_shuffle_change_map_disable 0

// 继续下一段，保证原来的执行顺序，避免一次灌满命令缓冲区。
exec cfgogl/applemod12v12/startup/shared_settings_06.cfg
