// STARTUP_BUFFER_CHUNKS: shared_settings 6/8; 后续配置位于同目录 startup/。
confogl_addcvar tank_trac_hp 2500
confogl_addcvar tank_trac_throw_hp 50
confogl_addcvar tank_pred_hp 1250

confogl_addcvar supply_indicator_announce 2

confogl_addcvar l4d2_heq_no_tank_horde 0
confogl_addcvar l4d2_heq_checkpoint_sound 1

confogl_addcvar sgspread_ring1_bullets 8
confogl_addcvar sgspread_ring1_factor  2
confogl_addcvar sgspread_center_pellet 1

// ===== 冲锋枪 / 霰弹枪：数值以 zonemod(2.0) shared_settings.cfg 为准 =====
// smg / smg_silenced / smg_mp5 / shotgun_chrome / pumpshotgun 五把枪逐项对齐
sm_weapon smg spreadpershot 0.22
sm_weapon smg maxmovespread 2
sm_weapon smg range 2000
sm_weapon smg rangemod 0.83
sm_weapon smg reloadduration 1.7

sm_weapon smg_silenced damage 27
sm_weapon smg_silenced spreadpershot 0.30
sm_weapon smg_silenced maxmovespread 2.35
sm_weapon smg_silenced rangemod 0.65

sm_weapon smg_mp5 range 2000
sm_weapon smg_mp5 rangemod 0.80
sm_weapon smg_mp5 maxmovespread 2.35
sm_weapon smg_mp5 reloadduration 2.7
sm_weapon smg_mp5 clipsize 60

sm_weapon pistol_magnum damage 90
sm_weapon pistol_magnum maxmovespread 1.5
sm_weapon pistol_magnum penlayers 3

// 霰弹枪（chrome / pump）：已与 zonemod 完全一致，此项勿再随意改动
sm_weapon shotgun_chrome scatterpitch 4
sm_weapon shotgun_chrome scatteryaw 4
sm_weapon shotgun_chrome damage 28
sm_weapon shotgun_chrome bullets 9
sm_weapon shotgun_chrome rangemod 0.65
sm_weapon pumpshotgun scatterpitch 3
sm_weapon pumpshotgun scatteryaw 5
sm_weapon pumpshotgun damage 16
sm_weapon pumpshotgun bullets 17

sm_weapon hunting_rifle cycletime 0.40
sm_weapon hunting_rifle damage 60
sm_weapon hunting_rifle tankdamagemult 0.75
sm_weapon sniper_scout clipsize 10
sm_weapon sniper_scout damage 120
sm_weapon sniper_scout tankdamagemult 0.5
sm_weapon sniper_awp clipsize 8
sm_weapon sniper_awp damage 150
sm_weapon sniper_awp tankdamagemult 0.5

sm_weapon rifle_sg552 damage 27
sm_weapon rifle_sg552 rangemod 0.81
sm_weapon rifle_sg552 range 3500
sm_weapon rifle_sg552 reloadduration 2
sm_weapon rifle_sg552 maxmovespread 5

static_tank_map c1m4_atrium
// 继续下一段，保证原来的执行顺序，避免一次灌满命令缓冲区。
exec cfgogl/applemod12v12/startup/shared_settings_07.cfg
