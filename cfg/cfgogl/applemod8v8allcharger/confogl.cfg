// =======================================================================================
// Each ConVar is registered once; confogl_setcvars runs only at the very end of the load chain.
// =======================================================================================

l4d_ready_cfg_name "applemod allcharger 8v8"

confogl_addcvar mp_gamemode "versus"
confogl_addcvar z_difficulty "normal"
confogl_addcvar confogl_pills_limit 6

confogl_addcvar sv_allow_lobby_connect_only 0

confogl_addcvar z_common_limit 30
confogl_addcvar z_ghost_delay_min 16
confogl_addcvar z_ghost_delay_max 16
confogl_addcvar z_mega_mob_size 50
confogl_addcvar z_mob_spawn_min_size 15
confogl_addcvar z_mob_spawn_max_size 15
confogl_addcvar z_mob_spawn_min_interval_normal 3600
confogl_addcvar z_mob_spawn_max_interval_normal 3600
confogl_addcvar tongue_drag_damage_amount 5

confogl_addcvar survivor_limit 8
confogl_addcvar z_max_player_zombies 8
// 8v8 只出 charger / boomer / spitter：hunter / jockey / smoker 上限归零（不再生成）
confogl_addcvar z_versus_smoker_limit 0
confogl_addcvar z_versus_boomer_limit 1
confogl_addcvar z_versus_hunter_limit 0
confogl_addcvar z_versus_spitter_limit 1
confogl_addcvar z_versus_jockey_limit 0
confogl_addcvar z_versus_charger_limit 7

confogl_addcvar z_tank_health 10000
confogl_addcvar tank_hp 0
// jockey 已不生成（z_versus_jockey_limit 0），本行只是引擎 cvar 的显式赋值，保留以免与 12v12 结构不一致
confogl_addcvar z_jockey_health 350

// ===== Charger 数值（8v8 新增） =====
// 血量 = 本配置的近战设置伤害 + 10：
//   startup/shared_settings_04.cfg:16  confogl_addcvar l4d2_melee_damage_charger 350.0
//   -> 350.0 + 10 = 360.0（一次满蓄近战正好打不死，需要补刀）
confogl_addcvar z_charger_health 360.0
// 技能速度 ×1.5（引擎默认 z_charge_max_speed 500、z_charge_start_speed 250；二者带 FCVAR_CHEAT，
// 由 confogl_addcvar 在 confogl_setcvars 时以服务端身份下发，不要改用客户端指令）
confogl_addcvar z_charge_max_speed 750
confogl_addcvar z_charge_start_speed 375

// Charger 伤害（引擎默认: pound_dmg 15 / charge_max_damage 10 / impact_radius 120 / claw_dmg 7 / incap 15）
confogl_addcvar z_charger_pound_dmg 10
confogl_addcvar z_charge_max_damage 10
confogl_addcvar z_charge_impact_radius 100
confogl_addcvar charger_dmg_incapped 20

exec cfgogl/applemod8v8allcharger/shared_cvars.cfg

exec cfgogl/applemod8v8allcharger/applemod8v8allcharger.cfg
