// 退出模式（sm_fm off）的回退值：与 12v12 的 confogl_off.cfg 写法保持一致 —— 一律回退到引擎原生 4 人，
// 不回退成 8。理由：这是"关掉模式"后的裸服默认状态，8 人要靠 confogl+多人插件才有意义，
// 半关状态下写 8 会出现引擎上限(survivor_limit)与多人插件(l4d_*)脱钩。
l4d_ready_enabled 0

reset_static_maps
sm_resetstringcount

confogl_resetclientcvars
confogl_resetcvars
sm_cvar z_tank_health 4000
sm_cvar l4d_survivor_limit 4
sm_cvar l4d_infected_limit 4
sm_cvar l4d_static_minimum_survivor 4
sm_cvar survivor_limit 4
sm_cvar z_max_player_zombies 4
pm_unload_plugins refresh
