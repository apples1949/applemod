// Disable ReadyUp
l4d_ready_enabled "0"   // This cvar doesnt do anything, but if it is 0 the logger wont log this game.

// Reset Default Common Limit, Static Spawns, and String Count
reset_static_maps
sm_resetstringcount

// Unlock Plugins and reload defaults
confogl_resetclientcvars
confogl_resetcvars
pred_unload_plugins
sm plugins load_unlock
sm plugins load l4d2_sv_tags.smx  //互联网显示服务器（confogl 比赛期间锁插件加载，所以先解锁→加载→恢复锁定）
sm plugins load_lock
