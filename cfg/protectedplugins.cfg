// =======================================================================================
// Plugin Manager - Protected Plugins
// =======================================================================================
// Confogl unloads every plugin when a matchmode loads or unloads (pm_unload_plugins).
// Plugins listed here are skipped, so they stay loaded through matchmode changes
// instead of being unloaded and loaded again.
//
// This is not meant to be a spot to add plugins that are loaded in every matchmode,
// just ones that NEED to stay loaded through matchmode changes.
//
// Entries are paths inside addons/sourcemod/plugins/, as used by "sm plugins load", matched
// case-insensitively.
// Plugin Manager always protects itself.
// =======================================================================================

// Will prevent issue with plugins that do cleanup on unload that need left4dhooks to do so.
pm_protect left4dhooks.smx

// Prevent issues during transitions between matchmodes.
pm_protect fixes/command_buffer.smx

// 互联网显示服务器（原先是在各模式 confogl_off.cfg 末尾 "sm plugins load_unlock" 之后
// 手动 load 一次，因为旧 unloader 会把它一起卸掉）。改为常驻后不需要重复加载，
// 首次加载仍由 sharedplugins.cfg 负责。
pm_protect l4d2_sv_tags.smx
